[package]
name = "platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Win32/WinRT specifics: DWM bounds, hit testing, capture exclusion, cursor, OCR, startup."

[lib]
name = "platform_windows"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
# `windows-core` is named separately because the `#[implement]` macro emits paths
# rooted at `::windows_core`, which the `windows` crate's re-export cannot satisfy.
# It is the version `windows` already depends on, so nothing new enters the build.
windows-core = "0.62.2"
# `windows-future` for the same reason: `RecognizeAsync` and `StoreAsync` hand back a
# `windows_future::IAsyncOperation`, and neither that type nor `AsyncStatus` is
# reachable through the `windows` crate's own re-exports. Again the version `windows`
# already depends on, so nothing new enters the build.
windows-future = "0.3.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    # §5.3.3/§5.3.4 的那一只手（`src/uia.rs`）：UIA 客户端的 COM 接口全部发在
    # `Win32::UI::Accessibility` 这一族里（`CUIAutomation` / `IUIAutomation` /
    # `IUIAutomationElement` / `IUIAutomationTreeWalker`）。不引新的链接库：这一族只用
    # 接口指针的 vtable，工厂是 `CoCreateInstance`（ole32，本来就在使用面上），
    # `UIAutomationCore.dll` 由 CLSID 在运行时加载。
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    # §5.8.3 第 1 步后半「或将文件拖到应用图标」的那一根管道（`src/instance.rs`）：
    # `CreateNamedPipeW` / `ConnectNamedPipe` / `DisconnectNamedPipe` / `WaitNamedPipeW`
    # 都在 `Win32::System::Pipes` 这一族里，它自己只依赖 `Win32::System`（不引新的链接库）。
    "Win32_System_Pipes",
    # 同一族里那几扇门的 `OVERLAPPED` 指针住在 `Win32::System::IO`：`ConnectNamedPipe` /
    # `ReadFile` / `WriteFile` 的签名里都带着它，所以这一族随它一起来（同样不引新的链接库）。
    "Win32_System_IO",
    "Win32_System_Time",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_StationsAndDesktops",
    # 屏幕读取那一条腿的读数要知道自己站在哪一块桌面上（`src/desktop.rs` 的 `display_reach`）：
    # `WTSGetActiveConsoleSessionId` / `ProcessIdToSessionId` 都在 `RemoteDesktop` 这一族，绑的是
    # `kernel32.dll`（`WTSGetActiveConsoleSessionId` 文档就写在 kernel32 名下），不引新的链接库。
    "Win32_System_RemoteDesktop",
    "Win32_System_WinRT",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_Security",
    "Win32_Media",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Security_Cryptography",
    "Win32_System_Registry",
    "Win32_Globalization",
    # §5.21.1 第 3 步那一次「真的去取那份清单」（`src/fetch.rs`）。这一枚 feature 是本项目
    # 第一次碰网络：绑的是 `wininet.dll`，走 `windows-core` 的 raw-dylib 那一套
    # （`#[link!("wininet.dll")]`），所以不引入新的链接库、也不需要 build script。
    "Win32_Networking_WinInet",
    "Devices_Enumeration",
] }

[dependencies]
falcon-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
image.workspace = true
