[package]
name = "qt_bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CXX-Qt controllers, models and the mandatory thin C++ shim."

[[bin]]
name = "falconshot"
path = "src/main.rs"

[features]
# R13's matrix is built, not configured: the same `--r13` run under this flag is
# the WGC column and without it the GDI column. Nothing else changes, which is
# what makes the two columns comparable.
default = []
wgc = ["falcon-core/wgc"]

[dependencies]
falcon-core.workspace = true
platform-windows.workspace = true
cxx = "=1.0.176"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
image.workspace = true
rayon.workspace = true

[build-dependencies]
cxx-qt-build = "0.10.0"
cxx-gen = "=0.7.176"
