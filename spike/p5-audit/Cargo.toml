[package]
name = "p5-audit"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
# Toggle to compare the two xcap capture paths on the same machine:
#   cargo run               -> wgc (Windows.Graphics.Capture)
#   cargo run --no-default-features -> gdi (BitBlt / PrintWindow)
default = ["wgc"]
wgc = ["xcap/wgc"]

[dependencies]
xcap = { version = "0.9.8", features = ["image"] }
image = "0.25"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

[profile.release]
debug = false
