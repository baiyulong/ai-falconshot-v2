[package]
name = "hello-cxxqt"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# cxx and cxx-gen are released in lockstep from the same repo (cxx 1.0.N <-> cxx-gen 0.7.N)
# and the generated C++ and Rust symbol names only match when they agree. cxx-qt 0.10.0's
# own committed Cargo.lock pins 1.0.176 / 0.7.176, so we pin both to that pair.
cxx = "=1.0.176"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }

[build-dependencies]
# NOTE: `link_qt_object_files` is only required when linking Qt 6 *statically*.
# Our Qt 6.10.1 install is the shared (DLL) build, so it stays off.
cxx-qt-build = "0.10.0"
# Forced onto the graph so Cargo unifies cxx-qt-lib's build-dep to the same lockstep pair.
cxx-gen = "=0.7.176"
